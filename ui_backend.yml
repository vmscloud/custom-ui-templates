version: '3.8'
services:
  backend:
    image: localhost:6007/custom-ui-backend:custom
    deploy:
      mode: global
      placement:
        constraints:
          - node.labels.custom == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    networks:
      mzc_network:
        aliases:
          - mzc_custom_ui_backend
    environment:
      - TZ=Asia/Seoul
      - APP_NAME=Mozart Cloud Custom UI
      - APP_VERSION=0.1.0
      - DEBUG=false
      - DATABASE_URL=postgresql://mzcadm:mzcadm@db:5432/mzc_aps
      - QUERY_EXECUTOR_BASE_URL=http://queryexecutor:18000
      - QUERY_EXECUTOR_DB_ALIAS=com
      - QUERY_EXECUTOR_LIMIT=50000
      - QUERY_TIMEOUT_SECONDS=120
      # Trino 접속 (필수).
      #   Swarm 내부에 Trino 서비스가 떠 있으면 그 alias(예: http://trino)로,
      #   외부 고정 IP 를 쓴다면 해당 값으로 override.
      - TRINO_HOST=${TRINO_HOST:-203.231.40.243}
      - TRINO_PORT=${TRINO_PORT:-18080}
      - TRINO_USER=${TRINO_USER:-mzcadm}
      - TRINO_CATALOG=iceberg
      - TRINO_SCHEMA_APS=mzc_aps
      # APS C# 백엔드 프록시 upstream.
      #   /api/custom/backend/.../proxy/* 요청이 이 URL 로 forward 된다.
      #   호스트 nginx 가 /api/aps/backend/... 를 ApiGateway 로 라우팅하는
      #   흐름과 동일하게, 같은 mzc_network overlay 의 ApiGateway 서비스
      #   alias 로 바로 쏜다(포트는 기본 80, 생략).
      #     예) APS_BACKEND_BASE_URL=http://apigw
      #         APS_BACKEND_BASE_URL=https://dev.mozart-cloud.com
      - APS_BACKEND_BASE_URL=${APS_BACKEND_BASE_URL:-http://apigw}
      - FLUENTBIT_URL=http://logger:9880
      - SYSTEM_NAME=custom
      - COMPONENT_NAME=backend

networks:
  mzc_network:
    external: true