server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /ext {
        alias /usr/share/nginx/html/;

        # 이름이 고정인 MF 엔트리는 절대 immutable 로 캐시하지 않는다.
        # 배포 후에도 브라우저/CDN 이 옛 remoteEntry.js 를 계속 쓰면
        # 안에 적힌 예전 해시를 따라가다 /assets/*.js 가 404 가 되어
        # 리모트 화면이 통째로 비어버린다.
        location = /ext/remoteEntry.js {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            expires -1;
        }
        location = /ext/index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            expires -1;
        }

        # 해시가 붙은 번들은 1년 immutable 로 캐시 (Vite 해시 기반 파일명)
        location ~ ^/ext/assets/.+\.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|map)$ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            expires 1y;
        }

        # 그 외 정적 리소스 (fonts, logo, favicon 등) — 짧게 캐시
        location ~ \.(?:png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)$ {
            add_header Cache-Control "public, max-age=3600" always;
            expires 1h;
        }

        # SPA fallback
        try_files $uri $uri/ /ext/index.html;
    }

    # 헬스체크
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok";
    }
}
