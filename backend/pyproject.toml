[project]
name = "moz-custom-ui"
version = "0.1.0"
description = "Mozart Cloud Custom UI Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aleatorik-pycommon==1.54.0",
    "fastapi>=0.123.5",
    "psycopg2-binary>=2.9.10",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "uvicorn>=0.38.0",
    "orjson>=3.10.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.7",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pytest-cov>=4.1.0",
]
